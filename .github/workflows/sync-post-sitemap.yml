name: Sync article sitemap

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-article-sitemap
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate same-domain article sitemap
        run: node scripts/sync-post-sitemap.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- sitemap-posts.xml; then
            echo "Article sitemap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap-posts.xml
          git commit -m "chore: sync article sitemap"
          git push
  
