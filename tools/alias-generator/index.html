  <style>
    :root{--bg:#090909;--panel:#12110f;--panel2:#181613;--line:rgba(211,174,99,.3);--gold:#d9b66c;--cream:#f5eee1;--muted:#9e968b;--green:#45c98a}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--cream);font-family:Arial,"Noto Sans TC",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(201,160,78,.14),transparent 42%),linear-gradient(135deg,#090909,#15120e 55%,#080808);overflow-x:hidden}.wrap{width:min(820px,calc(100% - 32px));margin:auto;padding:26px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}.brand{display:flex;align-items:center;gap:12px;color:var(--gold);text-decoration:none;font-weight:700;letter-spacing:.12em}.brand img{width:38px;height:38px;object-fit:contain}.back{color:var(--muted);text-decoration:none;font-size:14px}.back:hover{color:var(--gold)}.hero{text-align:center;margin-bottom:32px}.kicker{color:var(--gold);letter-spacing:.28em;font-size:12px;font-weight:700}.hero h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(42px,9vw,76px);line-height:1.08;margin:14px 0 12px;letter-spacing:.08em;background:linear-gradient(120deg,#b98a39,#fff1bd,#c59646);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);margin:0;line-height:1.8}.panel{border:1px solid var(--line);background:rgba(18,17,15,.82);border-radius:10px;padding:30px;box-shadow:0 18px 70px rgba(0,0,0,.24)}.section{padding:4px 0 28px;border-bottom:1px solid rgba(211,174,99,.14);margin-bottom:26px}.section:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}.section-number{color:var(--gold);font-size:12px;letter-spacing:.18em}.section h2{font-size:20px;margin:0}.hint{color:var(--muted);font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{border:1px solid rgba(211,174,99,.25);background:#171614;color:#c9c0b3;border-radius:999px;padding:11px 18px;font:inherit;cursor:pointer;transition:.2s}.chip:hover,.chip.selected{border-color:var(--gold);color:#1b1408;background:var(--gold);box-shadow:0 5px 18px rgba(211,174,99,.12)}.actions{display:flex;gap:12px;margin-top:30px}.button{flex:1;border:1px solid var(--gold);background:linear-gradient(135deg,#d5ae63,#efd28f);color:#171108;border-radius:5px;padding:15px 18px;font:700 16px inherit;cursor:pointer}.button.secondary{background:transparent;color:var(--gold);border-color:rgba(211,174,99,.4)}.results{margin-top:28px;display:grid;gap:10px}.result{display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(211,174,99,.22);background:linear-gradient(110deg,rgba(211,174,99,.08),rgba(255,255,255,.02));padding:17px 18px;border-radius:7px}.result strong{font:600 24px Georgia,"Noto Serif TC",serif;color:var(--cream);letter-spacing:.12em}.copy{background:transparent;color:var(--gold);border:0;cursor:pointer;font-size:13px}.notice{color:var(--muted);font-size:12px;text-align:center;margin:22px 0 0}.line{color:var(--green);text-decoration:none}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#1d3027;color:#d7ffeb;border:1px solid rgba(69,201,138,.5);padding:10px 15px;border-radius:6px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:560px){.wrap{width:min(100% - 22px,820px);padding-top:18px}.top{margin-bottom:36px}.panel{padding:21px 17px}.actions{flex-direction:column}.chip{padding:10px 14px}.result strong{font-size:21px}}
    .result{justify-content:center}.result-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.result-controls .button{margin:0}.toast{display:none}@media(max-width:560px){.result-controls{grid-template-columns:1fr}}

<body>
  <main class="wrap">
    <nav class="top"><a class="brand" href="../../index.html"><img src="../../logo.webp" alt="AS娛樂"><span>AS娛樂</span></a><a class="back" href="../../index.html">回到首頁</a></nav>
    <header class="hero"><div class="kicker">FIND YOUR NAME</div><h1>藝名神器</h1><p>選幾個符合妳的標籤，讓名字先替妳說出第一印象。</p></header>
    <section class="panel">
      <div class="section"><div class="section-head"><span class="section-number">01</span><h2>字數與格式</h2><span class="hint">可選可不選</span></div><div class="chips" data-group="length"><button class="chip" data-value="two">雙字名</button><button class="chip" data-value="all">都可以</button></div></div>
      <div class="section"><div class="section-head"><span class="section-number">02</span><h2>風格與派系</h2><span class="hint">可選可不選</span></div><div class="chips" data-group="style"><button class="chip" data-value="korean">韓系</button><button class="chip" data-value="japanese">日系</button><button class="chip" data-value="classic">中式古風</button><button class="chip" data-value="western">洋氣英文</button><button class="chip" data-value="elegant-style">優雅氣質</button><button class="chip" data-value="cool-style">冷艷俐落</button><button class="chip" data-value="sweet-style">甜美可愛</button><button class="chip" data-value="all">都可以</button></div></div>
      <div class="section"><div class="section-head"><span class="section-number">03</span><h2>人設與氣質</h2><span class="hint">可選可不選</span></div><div class="chips" data-group="mood"><button class="chip" data-value="elegant">御姐</button><button class="chip" data-value="neighbor">鄰家女孩</button><button class="chip" data-value="rich">千金大小姐</button><button class="chip" data-value="pure">純欲系</button><button class="chip" data-value="cool">高冷女王</button><button class="chip" data-value="sweet">甜美</button><button class="chip" data-value="mysterious">神秘感</button><button class="chip" data-value="independent">獨立大方</button><button class="chip" data-value="gentle">溫柔知性</button><button class="chip" data-value="playful">靈動俏皮</button><button class="chip" data-value="all">都可以</button></div></div>
      <div class="actions"><button class="button" id="generate">生成我的藝名</button></div>
      <div class="results" id="results" hidden></div><p class="notice">名字只是開始，想知道哪種工作適合妳，可以直接<a class="line" href="../../contact.html">來問我</a>。</p>
    </section>
  </main><div class="toast" id="toast">已複製</div>
  <script>
    const data={two:['恩妍','妍恩','若晴','沐妍','語希','安妮','宛庭','心妤','芷晴','語柔','沐恩','采薇','知妍','晚晴','若棠','知微'],korean:['恩妍','妍希','語恩','知妍','瑞妍','恩彩','宥真','恩娜','智妍','彩恩'],japanese:['凜花','千夏','美月','優奈','結衣','葵','琴音','莉央','花音','真希'],classic:['若棠','知微','晚晴','清妤','昭寧','芷蘭','靜姝','若蘭','知秋','月棠'],western:['Annie','Mia','Nina','Luna','Chloe','Ivy','Stella','Ava','Ella','Sophie','Bella','Grace'],elegant:['若棠','知妍','晚晴','靜姝','芷蘭','清妤','月棠'],neighbor:['安安','妍妍','語希','柔柔','恩恩','采薇','晴晴'],rich:['宛庭','心妤','沐恩','采薇','知妍','若棠'],pure:['恩妍','語安','若晴','妍希','晚晴','語柔'],cool:['凜花','知微','沐妍','昭寧','芷晴','靜姝'],sweet:['晴晴','妮妮','妍希','語柔','糖糖','安安'],mysterious:['知微','凜花','晚晴','靜姝','若棠','月棠'],independent:['采薇','知秋','若棠','芷晴','語安'],gentle:['語柔','心妤','恩妍','晚晴','知妍'],playful:['晴晴','妮妮','安安','妍妍','花音'],'elegant-style':['若棠','知妍','晚晴','靜姝','芷蘭','清妤'],'cool-style':['凜花','知微','昭寧','靜姝','芷晴'],'sweet-style':['晴晴','妮妮','妍希','語柔','安安']};
    const state={};document.querySelectorAll('.chips').forEach(group=>group.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;group.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state[group.dataset.group]=b.dataset.value}));
    function pick(){if(state.style==='western')return [...data.western].sort(()=>Math.random()-.5).slice(0,8);let pool=[];Object.values(state).forEach(v=>{if(data[v]&&v!=='all')pool.push(...data[v])});if(!pool.length)pool=[...data.two,...data.korean,...data.japanese,...data.classic];return [...new Set(pool)].sort(()=>Math.random()-.5).slice(0,8)}
    function reset(){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));Object.keys(state).forEach(x=>delete state[x]);const box=document.getElementById('results');box.innerHTML='';box.hidden=true}
    document.getElementById('generate').onclick=()=>{const box=document.getElementById('results');box.hidden=false;box.innerHTML=pick().map(x=>`<div class="result"><strong>${x}</strong></div>`).join('')+'<div class="result-controls"><button class="button" id="more">查看更多</button><button class="button secondary" id="bottomReset">重新選擇</button></div>';box.scrollIntoView({behavior:'smooth',block:'nearest'})};
    document.getElementById('results').onclick=e=>{if(e.target.id==='more'){const box=document.getElementById('results');box.innerHTML=pick().map(x=>`<div class="result"><strong>${x}</strong></div>`).join('')+'<div class="result-controls"><button class="button" id="more">查看更多</button><button class="button secondary" id="bottomReset">重新選擇</button></div>'}if(e.target.id==='bottomReset')reset()};
  </script>
</body></html>
