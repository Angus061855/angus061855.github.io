  <style>
    :root{--bg:#090909;--panel:#12110f;--line:rgba(211,174,99,.3);--gold:#d9b66c;--cream:#f5eee1;--muted:#9e968b;--green:#45c98a;--red:#df8178}*{box-sizing:border-box}html{background:var(--bg);color:var(--cream);font-family:Arial,"Noto Sans TC",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(201,160,78,.14),transparent 42%),linear-gradient(135deg,#090909,#15120e 55%,#080808);overflow-x:hidden}.wrap{width:min(920px,calc(100% - 32px));margin:auto;padding:26px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}.brand{display:flex;align-items:center;gap:12px;color:var(--gold);text-decoration:none;font-weight:700;letter-spacing:.12em}.brand img{width:38px;height:38px;object-fit:contain}.back{color:var(--muted);text-decoration:none;font-size:14px}.hero{text-align:center;margin-bottom:32px}.kicker{color:var(--gold);letter-spacing:.25em;font-size:12px;font-weight:700}.hero h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(38px,8vw,68px);line-height:1.1;margin:14px 0 12px;letter-spacing:.08em;background:linear-gradient(120deg,#b98a39,#fff1bd,#c59646);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);line-height:1.8;margin:0}.panel{border:1px solid var(--line);background:rgba(18,17,15,.86);border-radius:10px;padding:30px;box-shadow:0 18px 70px rgba(0,0,0,.24)}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(211,174,99,.2);margin:-30px -30px 28px}.tab{padding:18px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font:700 15px inherit;cursor:pointer}.tab.active{color:var(--gold);border-color:var(--gold)}.view[hidden]{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field input{width:100%;border:1px solid rgba(211,174,99,.25);border-radius:5px;background:#0e0d0b;color:var(--cream);padding:13px 14px;font:inherit}.field input:focus{outline:2px solid rgba(211,174,99,.5);outline-offset:1px}.subhead{margin:0 0 14px;font-size:19px}.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.check{display:flex;align-items:center;gap:8px;border:1px solid rgba(211,174,99,.18);border-radius:5px;padding:12px;color:var(--muted);font-size:13px}.check input{accent-color:var(--gold)}.button{width:100%;border:1px solid var(--gold);background:linear-gradient(135deg,#d5ae63,#efd28f);color:#171108;border-radius:5px;padding:15px 18px;font:700 16px inherit;cursor:pointer;margin-top:22px}.button.secondary{background:transparent;color:var(--gold);border-color:rgba(211,174,99,.4)}.button:disabled{opacity:.42;cursor:not-allowed}.timer-card{border:1px solid rgba(211,174,99,.2);background:rgba(7,7,6,.42);border-radius:7px;padding:24px;text-align:center}.timer-display{font:600 clamp(38px,10vw,64px)/1 Georgia,serif;letter-spacing:.08em;color:var(--cream)}.timer-status{color:var(--gold);font-size:13px;letter-spacing:.1em;margin-top:8px}.timer-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.timer-actions .button{margin-top:20px}.uncertain{border:0;background:transparent;color:var(--red);cursor:pointer;font:inherit;font-size:13px;margin-top:18px;padding:8px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}.metric{border-top:1px solid rgba(211,174,99,.25);padding:16px 4px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.metric strong{font:600 27px Georgia,"Noto Serif TC",serif;color:var(--gold)}.income{margin-top:25px;border:1px solid rgba(69,201,138,.35);background:linear-gradient(120deg,rgba(69,201,138,.08),rgba(255,255,255,.02));padding:20px;border-radius:7px}.income-row{display:flex;justify-content:space-between;gap:16px;color:var(--muted);padding:7px 0}.income-row strong{color:var(--cream);white-space:nowrap}.income-row.total{border-top:1px solid rgba(69,201,138,.2);margin-top:8px;padding-top:15px;color:var(--green)}.income-row.total strong{font-size:28px;color:#b8f6d2}.note{color:var(--muted);font-size:12px;line-height:1.8;text-align:center;margin:22px 0 0}.line{color:var(--green);text-decoration:none}@media(max-width:650px){.wrap{width:min(100% - 22px,920px);padding-top:18px}.top{margin-bottom:36px}.panel{padding:21px 17px}.tabs{margin:-21px -17px 24px}.grid{grid-template-columns:1fr;gap:15px}.full{grid-column:auto}.checks{grid-template-columns:repeat(2,1fr)}.timer-card{padding:20px 13px}.timer-actions{grid-template-columns:1fr}.timer-actions .button{margin-top:10px}.summary{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.metric strong{font-size:24px}.income-row{align-items:flex-start;font-size:13px}}
    .timer-actions{grid-template-columns:1fr}.timer-actions .button{min-height:72px;margin-top:10px;font-size:20px}.timer-actions .start{background:linear-gradient(135deg,#d5ae63,#efd28f);border-color:#efd28f;color:#171108}.timer-actions .pause{background:linear-gradient(135deg,#155c3d,#2fa56f);border-color:#45c98a;color:#e6fff0}.timer-actions .end{background:linear-gradient(135deg,#762b2b,#b9514d);border-color:#df8178;color:#fff1ef}.uncertain{border:1px solid rgba(211,174,99,.45);border-radius:5px;color:var(--gold);background:rgba(211,174,99,.08);padding:12px 18px}

<body><main class="wrap"><nav class="top"><a class="brand" href="../../index.html"><img src="../../logo.webp" alt="AS娛樂"><span>AS娛樂</span></a><a class="back" href="../../index.html">回到首頁</a></nav><header class="hero"><div class="kicker">WORK & INCOME</div><h1>磁扣時間與薪資試算</h1><p>把上下台時間、節數與扣除項目整理清楚，再估算一週大概能拿多少。</p></header><section class="panel"><div class="tabs"><button class="tab active" data-tab="time">上下台時間</button><button class="tab" data-tab="income">一週薪資</button></div>
  <div class="view" id="time"><h2 class="subhead">今天上班多久？</h2><div class="timer-card"><div class="timer-display" id="timerDisplay">00:00:00</div><div class="timer-status" id="timerStatus">尚未開始</div><div class="timer-actions"><button class="button start" id="startTimer">上台</button><button class="button pause" id="pauseTimer" disabled>下台</button><button class="button end" id="endTimer" disabled>結束計時</button></div><button class="uncertain" id="uncertainTimer">不確定今天的時間</button></div><div class="summary" id="timeResult"><div class="metric"><span>累計工作時間</span><strong>0 分鐘</strong></div><div class="metric"><span>約幾節</span><strong>0 節</strong></div><div class="metric"><span>計算方式</span><strong>10 分鐘／節</strong></div></div><p class="note" id="timerNote">按下「上台」開始，按「下台」暫停，最後按「結束計時」。</p></div>
  <div class="view" id="income" hidden><h2 class="subhead">一週大概實拿多少？</h2><div class="grid week-grid"><div class="field"><label for="mon">週一節數</label><input class="day-sections" id="mon" type="number" min="0" value="0"></div><div class="field"><label for="tue">週二節數</label><input class="day-sections" id="tue" type="number" min="0" value="0"></div><div class="field"><label for="wed">週三節數</label><input class="day-sections" id="wed" type="number" min="0" value="0"></div><div class="field"><label for="thu">週四節數</label><input class="day-sections" id="thu" type="number" min="0" value="0"></div><div class="field"><label for="fri">週五節數</label><input class="day-sections" id="fri" type="number" min="0" value="0"></div><div class="field"><label for="sat">週六節數</label><input class="day-sections" id="sat" type="number" min="0" value="0"></div><div class="field"><label for="sun">週日節數</label><input class="day-sections" id="sun" type="number" min="0" value="48"></div><div class="field"><label for="rate">每節薪資（自己填）</label><input id="rate" type="number" min="0" value="250"></div><div class="field"><label for="cleaning">清潔費</label><input id="cleaning" type="number" min="0" value="0"></div><div class="field"><label for="tax">稅金</label><input id="tax" type="number" min="0" value="0"></div><div class="field"><label for="other">其他費用（髮妝、櫃子等）</label><input id="other" type="number" min="0" value="0"></div></div><button class="button" id="calcIncome">試算一週收入</button><div class="income" id="incomeResult"><div class="income-row"><span>一週總節數</span><strong>48 節</strong></div><div class="income-row"><span>原始收入</span><strong>12,000 元</strong></div><div class="income-row"><span>預估扣除</span><strong>0 元</strong></div><div class="income-row total"><span>預估實拿</span><strong>12,000 元</strong></div></div></div><p class="note">這是自行輸入的估算工具，實際薪資依店家、班別與當週狀況為準。想確認適合自己的安排，可以直接<a class="line" href="../../contact.html">來問我</a>。</p></section></main>
  <script>
    const $=id=>document.getElementById(id), money=n=>Math.round(n).toLocaleString('zh-TW');
    function selectTab(name){const target=name==='income'?'income':'time';document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab===target));document.querySelectorAll('.view').forEach(view=>view.hidden=view.id!==target)}
    document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>selectTab(tab.dataset.tab));selectTab(new URLSearchParams(location.search).get('view'));
    function minutes(v){const [h,m]=v.split(':').map(Number);return h*60+m}
    let timer=null,startedAt=0,elapsed=0,running=false,uncertain=false,finished=false;const timerKey='as-time-calculator';function saveTimer(){localStorage.setItem(timerKey,JSON.stringify({startedAt,elapsed,running,uncertain,finished,savedAt:Date.now()}))}function loadTimer(){try{const saved=JSON.parse(localStorage.getItem(timerKey)||'null');if(!saved)return;startedAt=saved.startedAt||0;elapsed=saved.elapsed||0;running=!!saved.running;uncertain=!!saved.uncertain;finished=!!saved.finished;if(running){$('timerStatus').textContent='計時中';$('startTimer').textContent='上台';$('pauseTimer').disabled=false;$('endTimer').disabled=false;timer=setInterval(drawTimer,1000)}else if(finished){$('timerStatus').textContent=uncertain?'時間不確定':'已結束計時';$('startTimer').disabled=true;$('pauseTimer').disabled=true;$('endTimer').disabled=true}else if(elapsed){$('timerStatus').textContent='已下台，可繼續計時';$('startTimer').textContent='上台';$('pauseTimer').disabled=false;$('endTimer').disabled=false}}catch(e){localStorage.removeItem(timerKey)}}function drawTimer(){const total=Math.floor((elapsed+(running?Date.now()-startedAt:0))/1000),h=String(Math.floor(total/3600)).padStart(2,'0'),m=String(Math.floor(total%3600/60)).padStart(2,'0'),s=String(total%60).padStart(2,'0');$('timerDisplay').textContent=`${h}:${m}:${s}`;const mins=Math.floor(total/60);$('timeResult').innerHTML=`<div class="metric"><span>累計工作時間</span><strong>${mins} 分鐘</strong></div><div class="metric"><span>約幾節</span><strong>${Math.floor(mins/10)} 節</strong></div><div class="metric"><span>計算方式</span><strong>10 分鐘／節</strong></div>`}function stopTimer(){if(running){elapsed+=Date.now()-startedAt;running=false}clearInterval(timer);timer=null;saveTimer();drawTimer()}$('startTimer').onclick=()=>{if(!running&&!finished){startedAt=Date.now();running=true;uncertain=false;$('timerStatus').textContent='計時中';$('startTimer').textContent='上台';$('pauseTimer').disabled=false;$('endTimer').disabled=false;timer=setInterval(drawTimer,1000);saveTimer();drawTimer()}};$('pauseTimer').onclick=()=>{stopTimer();$('timerStatus').textContent='已下台，可繼續計時'};$('endTimer').onclick=()=>{stopTimer();finished=true;$('timerStatus').textContent='已結束計時';$('startTimer').disabled=true;$('pauseTimer').disabled=true;$('endTimer').disabled=true;$('timerNote').textContent='已完成本次記錄，10 分鐘算 1 節。';saveTimer()};$('uncertainTimer').onclick=()=>{stopTimer();uncertain=true;finished=true;$('timerStatus').textContent='時間不確定';$('timerNote').textContent='如果不確定，先記下來，之後可以直接來問我確認。';$('startTimer').disabled=true;$('pauseTimer').disabled=true;$('endTimer').disabled=true;saveTimer()};loadTimer();drawTimer();
    $('calcIncome').onclick=()=>{const sections=[...document.querySelectorAll('.day-sections')].reduce((sum,input)=>sum+Math.max(0,Number(input.value)||0),0),rate=Math.max(0,Number($('rate').value)||0),clean=Math.max(0,Number($('cleaning').value)||0),tax=Math.max(0,Number($('tax').value)||0),other=Math.max(0,Number($('other').value)||0),gross=sections*rate,totalDeduction=tax+clean+other,net=gross-totalDeduction;$('incomeResult').innerHTML=`<div class="income-row"><span>一週總節數</span><strong>${sections} 節</strong></div><div class="income-row"><span>原始收入（${sections} 節 × ${money(rate)} 元）</span><strong>${money(gross)} 元</strong></div><div class="income-row"><span>預估扣除</span><strong>− ${money(totalDeduction)} 元</strong></div><div class="income-row total"><span>預估實拿</span><strong>${money(net)} 元</strong></div>`};
  </script></body></html>
